<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CosmoPulse</title><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050a24;--card:#0d1748cc;--tx:#eef3ff;--mu:#a3b4e6;--ac:#2f8bff;--g:#2ee59d;--y:#ffc83d;--r:#ff5468;--bd:#2f4599;color-scheme:dark}


*{box-sizing:border-box}body{margin:0;color:var(--tx);font:15px/1.5 'Exo 2',system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#cfe0ff,transparent),radial-gradient(1.5px 1.5px at 160px 70px,#ffe9b0,transparent),radial-gradient(1px 1px at 230px 190px,#fff,transparent),radial-gradient(ellipse at 12% 0%,#1d36a366,transparent 55%),radial-gradient(ellipse at 95% 100%,#8a1fb066,transparent 55%),radial-gradient(ellipse at 70% 40%,#fc3d2118,transparent 50%),var(--bg);background-size:260px 230px,260px 230px,260px 230px,260px 230px,auto,auto,auto,auto;background-attachment:fixed}h1,h2,h3{font-family:Orbitron,'Exo 2',system-ui,sans-serif;letter-spacing:.04em}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px;background:linear-gradient(90deg,#0b3d91,#5b2bb5 60%,#fc3d21);border-bottom:2px solid #ffffff55;box-shadow:0 4px 24px #2f8bff44}header h1{font-size:20px;margin:0;color:#fff;text-transform:uppercase;letter-spacing:.18em;text-shadow:0 0 12px #ffffff88}header .b{color:#fff;background:#0008}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}nav button{white-space:nowrap;border-radius:99px;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600}
main{max-width:980px;margin:0 auto;padding:0 16px 40px}
button,input{font:inherit;color:var(--tx)}button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s}button:hover{transform:translateY(-1px);box-shadow:0 0 12px #2f8bff66}
button.on,button.p{background:linear-gradient(135deg,#2f8bff,#8a4dff);border-color:transparent;color:#fff;box-shadow:0 0 14px #2f8bff88}input{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(6px);box-shadow:0 4px 22px #00000066,inset 0 0 0 1px #ffffff0d}.hero{background:linear-gradient(120deg,#0b3d91dd,#5b2bb5cc 70%,#fc3d2199);border-color:#7fb4ff88}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.grid .card{margin:0}.tile{cursor:pointer;border-top:3px solid var(--c);transition:transform .15s}.tile:hover{transform:translateY(-3px)}
.tile h2{margin:2px 0;font-size:24px;color:var(--c);text-shadow:0 0 10px var(--c)}.tile h2 span,small,.mu{color:var(--mu);font-size:13px;font-weight:400}
.b{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;border:1px solid currentColor}.b.g{color:var(--g)}.b.y{color:var(--y)}.b.r{color:var(--r)}
.ch{width:100%;height:auto;display:block;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.reg{fill:var(--c);fill-opacity:.35;stroke:var(--c);stroke-width:1.5;cursor:pointer;transition:fill-opacity .2s}.reg:hover{fill-opacity:.6}.reg.on{fill-opacity:.9;filter:drop-shadow(0 0 7px var(--c))}
.circ{width:120px;height:120px;border-radius:50%;background:var(--ac);margin:14px auto;opacity:.5}.circ.go{animation:br 10s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(.6)}40%{transform:scale(1.1)}}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:5px;border-bottom:1px solid var(--bd)}
#T{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;padding:8px 16px;border-radius:99px;z-index:5}
.err{color:var(--r)}
@media print{body{background:#fff!important}:root,:root:not([data-theme="dark"]){--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#999;--g:#000;--y:#000;--r:#000}header,nav,.np,#T{display:none!important}}
</style></head><body>
<div id="app"></div><div id="T" hidden></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={
hr:{n:'Heart rate',u:'bpm',b:65,a:30,z:220,w:15,r:30,g:'heart',h:'Sit quietly for 5 minutes. Place two fingers on your wrist and count beats for 60 seconds, or use the pulse sensor.'},
sys:{n:'Blood pressure (systolic)',u:'mmHg',b:118,a:60,z:260,w:10,r:20,g:'heart',h:'Rest seated for 5 minutes with your arm at heart level. Fit the cuff snugly, stay still and record the top number.'},
temp:{n:'Body temperature',u:'°C',b:36.6,a:34,z:42,w:2,r:4,g:'body',h:'Use the digital thermometer. Wait for the signal, then record the reading.'},
spo2:{n:'Blood oxygen (SpO₂)',u:'%',b:98,a:50,z:100,w:3,r:6,lo:1,g:'lungs',h:'Clip the pulse oximeter on a warm fingertip, keep the hand still and record the value once it stabilizes.'},
sleep:{n:'Sleep duration',u:'h',b:7.5,a:0,z:16,w:20,r:40,lo:1,g:'brain',h:'Enter the total hours slept in your last sleep period.'},
mood:{n:'Mood (1–5)',u:'',b:4,a:1,z:5,w:25,r:50,lo:1,g:'brain',h:'Rate how you feel right now: 1 very low, 5 very good.'},
mass:{n:'Body mass',u:'kg',b:72,a:30,z:200,w:3,r:6,g:'bones',h:'Use the onboard mass measurement device following the crew procedure and record the displayed mass.'},
ex:{n:'Exercise',u:'min',b:60,a:0,z:300,w:40,r:70,lo:1,g:'muscles',h:'Enter the total minutes of exercise completed today.'},
rad:{n:'Radiation dose',u:'mSv/day',b:0.5,a:0,z:20,w:50,r:150,g:'body',h:'Read the personal dosimeter and enter the daily dose.'}};
const G={brain:['Brain','Mood, sleep and wellbeing'],heart:['Heart','Heart rate and blood pressure'],lungs:['Lungs','Blood oxygen saturation'],bones:['Bones','Body mass (context only; this is not a bone-density measurement)'],muscles:['Muscles','Exercise and physical activity'],body:['Whole body','Temperature and radiation exposure']};
const L=[['Normal','●','g'],['Attention required','▲','y'],['Urgent assessment','■','r']];
const A=['Continue routine monitoring.','Review the trend, re-measure after rest and note it for ground support.','Follow the relevant mission medical protocol and contact ground medical support.'];
const b=l=>`<span class="b ${L[l][2]}">${L[l][1]} ${L[l][0]}</span>`;
const C={hr:'#ff5d73',sys:'#ff8a3d',temp:'#ffc83d',spo2:'#2ee59d',sleep:'#9a8dff',mood:'#ff6bd6',mass:'#2fd4ff',ex:'#7dff6b',rad:'#fc3d21'},RC={brain:'#9a8dff',heart:'#ff5d73',lungs:'#2fd4ff',bones:'#e8ecf8',muscles:'#ff8a3d',body:'#2ee59d'};
const fmt=t=>new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function seed(){const R=[];let x=7;const rnd=()=>(x=(x*9301+49297)%233280)/233280-.5;
for(let d=13;d>=0;d--){const t=Date.now()-d*864e5,add=(k,v)=>R.push({id:k+d,k,v:+v.toFixed(2),t,src:'simulated'});
add('hr',65+rnd()*6+(d<2?8:0));add('sys',118+rnd()*8);add('temp',36.6+rnd()*.4);add('spo2',98-Math.abs(rnd())*1.5);
add('sleep',d<=4?[5,6,7,7.5,8][d]:7.6+rnd());add('mood',Math.max(1,Math.round(4+rnd()*1.5-(d<3?1:0))));
add('mass',72-(13-d)*.05+rnd()*.3);add('ex',60+rnd()*20-(d<3?25:0));add('rad',.5+rnd()*.1)}return R}
let S;try{S=JSON.parse(localStorage.getItem('ow1'))}catch(_){}
if(!S)S={r:seed(),a:[{t:Date.now()-36e5,k:'sleep',l:1,m:'Sleep duration trending down over 5 days (simulated demo alert)'}],p:{name:'Cdr. A. Nair',mission:'LDM-07 Lunar Habitat',bl:{}}};
for(const k in S.p.bl)if(I[k])I[k].b=S.p.bl[k];
S.u=0;const save_=()=>{try{localStorage.setItem('ow1',JSON.stringify({...S,u:0}))}catch(_){}};
const ser=(k,n=99)=>S.r.filter(r=>r.k==k).sort((a,b)=>a.t-b.t).slice(-n),last=k=>ser(k,1)[0];
const dv=(k,v)=>{const i=I[k];return Math.max(0,(i.lo?i.b-v:Math.abs(v-i.b))/i.b*100)};
const lv=(k,v)=>{const d=dv(k,v),i=I[k];return d>=i.r?2:d>=i.w?1:0};
const tr=k=>{const s=ser(k,4).map(r=>r.v);if(s.length<4)return 0;const dec=s.every((v,i)=>!i||v<s[i-1]),inc=s.every((v,i)=>!i||v>s[i-1]);return(dec||inc)&&dv(k,s[3])>=I[k].w/2?1:0};
const comb=()=>['sleep','mood','ex'].filter(k=>last(k)&&lv(k,last(k).v)>=1).length>=2;
const an=(k,v)=>({d:dv(k,v),l:lv(k,v),t:tr(k)});
function save(k,v){S.r.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),k,v,t:Date.now(),src:'manual',pend:!navigator.onLine});
const a=an(k,v);if(a.l||a.t)S.a.unshift({t:Date.now(),k,l:Math.max(a.l,a.t),m:`${I[k].n} ${v} ${I[k].u} (${a.d.toFixed(0)}% from baseline)${a.t?', repeated change in the same direction':''}`});
if(['sleep','mood','ex'].includes(k)&&comb())S.a.unshift({t:Date.now(),k,l:1,m:'Wellbeing review: sleep, mood and activity have changed together'});save_()}
const ch=(k,m)=>{const s=ser(k,14).map(r=>r.v),i=I[k],W=300,H=m?36:90;if(s.length<2)return'';const all=[...s,i.b],lo=Math.min(...all),hi=Math.max(...all),y=v=>H-4-(v-lo)/((hi-lo)||1)*(H-8),x=j=>j/(s.length-1)*W;
return `<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="${i.n} trend"><line x1="0" x2="${W}" y1="${y(i.b)}" y2="${y(i.b)}" stroke="var(--mu)" stroke-dasharray="4 4"/><polyline fill="none" stroke="var(--c,var(--ac))" stroke-width="2" points="${s.map((v,j)=>x(j)+','+y(v)).join(' ')}"/></svg>`+(m?'':'<small>Dashed line = personal baseline</small>')};
const stat=k=>{const r=last(k);return r?Math.max(lv(k,r.v),tr(k)):0};
const overall=()=>Math.max(comb()?1:0,...Object.keys(I).map(stat));
const detail=k=>{const r=last(k),i=I[k];return r?`<div style="margin-bottom:14px;--c:${C[k]}"><b>${i.n}</b> ${b(stat(k))}<div>${r.v} ${i.u} · baseline ${i.b} · deviation ${dv(k,r.v).toFixed(1)}%${tr(k)?' · trending':''}</div>${ch(k)}<small>${A[stat(k)]}</small></div>`:''};
let TAB='dash',RG='heart',W={s:0,k:'hr',v:'',e:''},M={m:0,s:0,q:0},BR=0,RP=0,LE='';
const toast=m=>{const t=$('#T');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,2800)};
const go=(t,g)=>{TAB=t;if(g)RG=g;R()};
const V={
dash:()=>{const o=overall();return `<div class="card hero"><small>🚀 Mission ${e(S.p.mission)} · ${e(S.p.name)}</small><h2 style="margin:4px 0">Overall status ${b(o)}</h2><div>${A[o]}</div></div><div class="grid">`+Object.keys(I).map(k=>{const r=last(k);return `<div class="card tile" style="--c:${C[k]}" onclick="go('map','${I[k].g}')"><small>${I[k].n}</small><h2>${r?r.v:'–'} <span>${I[k].u}</span></h2>${b(stat(k))}${ch(k,1)}</div>`}).join('')+`</div><div class="card" style="margin-top:12px"><b>Recent alerts</b>${S.a.slice(0,3).map(a=>`<p>${b(a.l)} <small>${fmt(a.t)}</small><br>${e(a.m)}</p>`).join('')||'<p class="mu">No alerts.</p>'}</div>`},
map:()=>{const f=(r,x)=>`class="reg ${RG==r?'on':''}" style="--c:${RC[r]}" onclick="go('map','${r}')" tabindex="0" role="button" aria-label="${G[r][0]}" ${x}`;
return `<div class="two"><div class="card"><svg viewBox="0 0 200 350" style="width:100%;max-height:520px"><rect ${f('body','x="62" y="68" width="76" height="130" rx="28"')}/><circle ${f('brain','cx="100" cy="38" r="26"')}/><rect ${f('muscles','x="26" y="76" width="26" height="115" rx="12"')}/><rect ${f('muscles','x="148" y="76" width="26" height="115" rx="12"')}/><rect ${f('bones','x="70" y="204" width="26" height="135" rx="10"')}/><rect ${f('bones','x="104" y="204" width="26" height="135" rx="10"')}/><ellipse ${f('lungs','cx="82" cy="112" rx="14" ry="24"')}/><ellipse ${f('lungs','cx="118" cy="112" rx="14" ry="24"')}/><circle ${f('heart','cx="106" cy="130" r="11"')}/></svg><div class="row">${Object.keys(G).map(r=>`<button class="${RG==r?'on':''}" onclick="go('map','${r}')">${G[r][0]}</button>`).join('')}</div></div>
<div class="card"><h2 style="margin-top:0">${G[RG][0]}</h2><p class="mu">${G[RG][1]}</p>${Object.keys(I).filter(k=>I[k].g==RG).map(detail).join('')}<button class="p" onclick="W={s:0,k:'hr',v:'',e:''};go('measure')">Record a measurement</button></div></div>`},
measure:()=>{const i=I[W.k];let h='';
if(W.s==0)h=`<h2>1 · Choose an indicator</h2><div class="grid">${Object.keys(I).map(k=>`<button onclick="wz.pick('${k}')">${I[k].n}</button>`).join('')}</div>`;
if(W.s==1)h=`<h2>2 · ${i.n}: instructions</h2><p>${i.h}</p><div class="row"><button onclick="wz.rs()">Back</button><button class="p" onclick="wz.nx()">Ready to record</button></div>`;
if(W.s==2)h=`<h2>3 · Enter value (${i.u||'score'})</h2><input id="wv" type="number" step="any" value="${e(W.v)}" aria-label="value"><p class="err">${W.e}</p><small>Accepted range ${i.a}–${i.z}</small><div class="row" style="margin-top:8px"><button onclick="W.s=1;R()">Back</button><button class="p" onclick="wz.nx()">Continue</button></div>`;
if(W.s==3)h=`<h2>4 · Confirm</h2><p>Save <b>${i.n}: ${W.v} ${i.u}</b>?</p><div class="row"><button onclick="W.s=2;R()">Edit</button><button class="p" onclick="wz.nx()">Save reading</button></div>`;
if(W.s==4){const a=an(W.k,W.v),l=Math.max(a.l,a.t);h=`<h2>Reading saved</h2><p>${b(l)}</p><p>Deviation from baseline (${i.b} ${i.u}): <b>${a.d.toFixed(1)}%</b>${a.t?'<br>Repeated change in the same direction detected.':''}</p><p>${A[l]}</p>${navigator.onLine?'':'<p class="mu">Offline: stored locally, will sync when connection returns.</p>'}<button class="p" onclick="wz.rs()">Record another</button>`}
return `<div class="card">${h}</div>`},
analytics:()=>`<div class="card"><b>Baseline deviation</b><p class="mu">D = (|X − B| ÷ |B|) × 100. Example: baseline 65 bpm, reading 78 bpm gives D = 20%. This is a numerical difference only and is not a diagnosis.</p></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${Object.keys(I).map(k=>{const r=last(k);return `<div class="card" style="--c:${C[k]}"><b>${I[k].n}</b> ${b(stat(k))}<div class="mu">Latest ${r?r.v:'–'} ${I[k].u} · baseline ${I[k].b} · deviation ${r?dv(k,r.v).toFixed(1):'–'}%${tr(k)?' · trend flagged':''}</div>${ch(k)}</div>`}).join('')}</div>`,
well:()=>`<div class="card"><h2 style="margin-top:0">Daily check-in</h2><p>Mood</p><div class="row">${['😞','😕','😐','🙂','😄'].map((m,n)=>`<button class="${M.m==n+1?'on':''}" onclick="wb.m(${n+1})" aria-label="Mood ${n+1}">${m} ${n+1}</button>`).join('')}</div><p>Stress level (1 low – 5 high)</p><div class="row">${[1,2,3,4,5].map(n=>`<button class="${M.s==n?'on':''}" onclick="wb.s(${n})">${n}</button>`).join('')}</div><p>Sleep duration (hours)</p><input id="sh" type="number" step="0.1" style="max-width:160px"><p>Sleep quality (1–5)</p><div class="row">${[1,2,3,4,5].map(n=>`<button class="${M.q==n?'on':''}" onclick="wb.q(${n})">${n}</button>`).join('')}</div><p><button class="p" onclick="wb.ok()">Save check-in</button></p>${comb()?`<p>${b(1)} Sleep, mood and activity have changed together. Consider a wellbeing review and a rest or relaxation period.</p>`:''}</div>
<div class="card"><b>Guided relaxation</b><div class="circ ${BR?'go':''}"></div><div class="row" style="justify-content:center"><button onclick="BR=!BR;R()">${BR?'Stop':'Start breathing exercise'}</button></div><p class="mu" style="text-align:center">Breathe in as the circle grows, out slowly as it shrinks.</p></div><div class="card"><b>Mood history</b>${ch('mood')}<b>Sleep history</b>${ch('sleep')}</div>`,
alerts:()=>`<div class="card"><b>Alert history</b>${S.a.map(a=>`<p>${b(a.l)} <small>${fmt(a.t)}</small><br>${e(a.m)}<br><small>${A[a.l]}</small></p>`).join('')||'<p class="mu">No alerts.</p>'}<small>Green, yellow and red rules are illustrative prototype logic and must be validated against approved mission medical protocols before operational use.</small></div>`,
report:()=>`<div class="card np"><b>Medical summary for ground support</b><p class="mu">Generates a structured summary. Use Print / Save as PDF in your browser to export.</p><div class="row"><button class="p" onclick="RP=1;R()">Generate report</button>${RP?'<button onclick="print()">Print / Save as PDF</button>':''}</div></div>`+(RP?`<div class="card"><h2 style="margin-top:0">CosmoPulse Medical Summary</h2><p>Astronaut: ${e(S.p.name)}<br>Mission: ${e(S.p.mission)}<br>Generated: ${new Date().toLocaleString()}<br>Overall status: ${L[overall()][1]} ${L[overall()][0]}</p><table><tr><th>Indicator</th><th>Latest</th><th>Baseline</th><th>Dev.</th><th>Status</th></tr>${Object.keys(I).map(k=>{const r=last(k);return `<tr><td>${I[k].n}</td><td>${r?r.v+' '+I[k].u:'–'}</td><td>${I[k].b}</td><td>${r?dv(k,r.v).toFixed(1):'–'}%</td><td>${L[stat(k)][1]} ${L[stat(k)][0]}</td></tr>`}).join('')}</table><h3>Recent alerts</h3>${S.a.slice(0,6).map(a=>`<p>${L[a.l][1]} ${fmt(a.t)}: ${e(a.m)}</p>`).join('')||'<p>None.</p>'}<small>Prototype decision-support output. Not a diagnosis and not a substitute for mission medical protocols or professional assessment.</small></div>`:''),
profile:()=>`<div class="card"><h2 style="margin-top:0">Astronaut profile</h2><p>Name<input id="pn" value="${e(S.p.name)}"></p><p>Mission<input id="pm" value="${e(S.p.mission)}"></p><b>Personal baselines</b><div class="grid" style="margin:8px 0">${Object.keys(I).map(k=>`<label><small>${I[k].n} (${I[k].u})</small><input data-bl="${k}" type="number" step="any" value="${I[k].b}"></label>`).join('')}</div><div class="row"><button class="p" onclick="pf()">Save profile</button><button onclick="S.u=0;R()">Log out</button></div></div>`};
const wz={pick:k=>{W={s:1,k,v:'',e:''};R()},rs:()=>{W={s:0,k:'hr',v:'',e:''};R()},nx:()=>{if(W.s==2){const raw=$('#wv').value,v=parseFloat(raw),i=I[W.k];W.v=raw;if(isNaN(v)||v<i.a||v>i.z){W.e=`Enter a value between ${i.a} and ${i.z}.`;return R()}W.v=v;W.e=''}W.s++;if(W.s==4)save(W.k,W.v);R()}};
const wb={m:n=>{M.m=n;R()},s:n=>{M.s=n;R()},q:n=>{M.q=n;R()},ok:()=>{const h=parseFloat($('#sh').value);if(!M.m||isNaN(h)||h<0||h>16)return toast('Choose a mood and enter sleep hours (0–16).');save('mood',M.m);save('sleep',h);last('mood').st=M.s;last('sleep').q=M.q;save_();M={m:0,s:0,q:0};toast('Check-in saved');R()}};
function pf(){S.p.name=$('#pn').value;S.p.mission=$('#pm').value;document.querySelectorAll('[data-bl]').forEach(x=>{const v=parseFloat(x.value);if(v>0){I[x.dataset.bl].b=v;S.p.bl[x.dataset.bl]=v}});save_();toast('Profile saved');R()}
function login(){if($('#lu').value=='astronaut'&&$('#lp').value=='orbit7'){S.u=1;LE='';R()}else{LE='Invalid username or password.';R()}}
const T_={dash:'Dashboard',map:'Body map',measure:'Measure',analytics:'Analytics',well:'Wellbeing',alerts:'Alerts',report:'Report',profile:'Profile'};
function R(){const p=S.r.filter(r=>r.pend).length,app=$('#app');
if(!S.u){app.innerHTML=`<main style="max-width:380px;padding-top:60px"><div class="card"><h1 style="margin-top:0">🛰️ CosmoPulse</h1><p class="mu">Offline-first astronaut health monitoring and decision support.</p><p><input id="lu" placeholder="Username" autocomplete="username"></p><p><input id="lp" type="password" placeholder="Password" autocomplete="current-password"></p><p class="err">${LE}</p><button class="p" onclick="login()">Log in</button><p><small>Demo login: astronaut / orbit7</small></p></div></main>`;return}
